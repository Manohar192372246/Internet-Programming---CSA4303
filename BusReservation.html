<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bus Reservation</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="reservation-card">
    <div class="header">
      <h1>City Express Bus Reservation</h1>
      <p>Book your seat in a few clicks</p>
    </div>
    <div class="form-section">
      <div class="row">
        <div class="form-group">
          <label for="from">From</label>
          <select id="from">
            <option>Chennai</option>
            <option>Bangalore</option>
            <option>Coimbatore</option>
          </select>
        </div>
        <div class="form-group">
          <label for="to">To</label>
          <select id="to">
            <option>Madurai</option>
            <option>Trichy</option>
            <option>Salem</option>
          </select>
        </div>
      </div>
      <div class="row">
        <div class="form-group">
          <label for="date">Journey Date</label>
          <input type="date" id="date">
        </div>
        <div class="form-group">
          <label for="passengers">Passengers</label>
          <input type="number" id="passengers" min="1" max="4" value="1">
        </div>
      </div>
      <div class="seat-map">
        <h3>Select Your Seat</h3>
        <div class="seats">
          <div class="seat available">A1</div>
          <div class="seat available">A2</div>
          <div class="seat booked">A3</div>
          <div class="seat available">A4</div>
          <div class="seat booked">B1</div>
          <div class="seat available">B2</div>
          <div class="seat available">B3</div>
          <div class="seat selected">B4</div>
          <div class="seat available">C1</div>
          <div class="seat available">C2</div>
          <div class="seat booked">C3</div>
          <div class="seat available">C4</div>
        </div>
        <div class="legend">
          <span><span class="dot available"></span> Available</span>
          <span><span class="dot booked"></span> Booked</span>
          <span><span class="dot selected"></span> Selected</span>
        </div>
      </div>
      <button class="book-btn">Confirm Booking</button>
    </div>
  </div>
</body>
</html>
